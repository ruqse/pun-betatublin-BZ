# R environment for scripts/ (figures and tables).
# Create:  micromamba create -f envs/r-figures.yml   (or: conda env create -f envs/r-figures.yml)
# Use:     micromamba activate pun-btub-r && bash scripts/run_all.sh
name: pun-btub-r
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - r-base=4.3.3
  - r-magrittr=2.0.3
  - r-ggplot2=3.5.1
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-readr=2.1.5
  - r-stringr=1.5.1
  - r-patchwork=1.2.0
  - r-scales=1.3.0
  - r-cluster=2.1.6
  - r-rcolorbrewer=1.1_3
  - r-ggrepel=0.9.5
  - bioconductor-biostrings=2.68.1
  - bioconductor-tximport=1.28.0
  - bioconductor-deseq2=1.40.2
  - bioconductor-genomicfeatures=1.52.1
  - bioconductor-annotationdbi=1.62.2
